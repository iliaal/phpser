name: Release Linux & macOS binaries

# Triggered when a GitHub Release is published. Builds .so binaries for
# Linux glibc (x86_64 + arm64) and macOS (arm64) at the PHP versions in
# the matrix (NTS only -- ZTS lives in the Windows lane), uploads each
# as a release asset via php/pie-ext-binary-builder using PIE's
# pre-packaged-binary naming convention.
#
# macOS Intel (macos-13) is intentionally absent -- GitHub's Intel
# runner pool is too contended to ship reliably (jobs queue 30+ min on
# busy days, blocking release closeout), and macOS 26 drops Intel
# support anyway. Intel-Mac users source-build via PIE's
# composer-default fallback.
#
# Linux musl (Alpine) is intentionally absent -- shivammathur/setup-php
# in Alpine containers needs more setup, and Alpine users get install via
# PIE's composer-default source-build fallback in the meantime. Add a
# musl lane only if user demand surfaces.
#
# composer.json declares:
#   "download-url-method": ["pre-packaged-binary", "composer-default"]
# so PIE prefers the prebuilt asset and falls back to source-build when
# no asset matches.

# workflow_dispatch compiles the same matrix and asserts the module loads,
# without uploading -- php/pie-ext-binary-builder builds and uploads in one
# step and requires a release tag, so the dispatch path runs a plain
# phpize/configure/make instead. That exercises each runner's toolchain and
# glibc/macOS baseline on a candidate commit before the tag exists.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

env:
  # Shared by the dispatch build below and the release upload action, so the
  # two paths cannot drift into configuring the extension differently.
  CONFIGURE_FLAGS: '--enable-phpser'

concurrency:
  # tag_name is empty on a dispatch run; fall back to the ref so two
  # dispatches on different branches do not serialize behind each other.
  group: release-linux-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.os }} php ${{ matrix.php }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # Uploads binary assets to the published release.
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 (x86_64), ubuntu-24.04-arm (arm64),
        # macos-14 (Apple Silicon arm64). Pinned over `*-latest` to
        # avoid silent runner shifts that would change the toolchain /
        # glibc baseline on published release assets without a repo
        # diff.
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-14
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # master
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # Dispatch path: prove the toolchain builds a loadable module. No
      # release exists yet, so there is nothing to upload into.
      - name: Build and verify (no upload)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -eux
          phpize
          ./configure $CONFIGURE_FLAGS
          make -j"$(getconf _NPROCESSORS_ONLN)"
          php -n -d extension="$PWD/modules/phpser.so" --ri phpser

      - name: Build and upload prebuilt binary
        if: github.event_name == 'release'
        uses: php/pie-ext-binary-builder@cbe134360897f23793f23c2edc7602261d205a25 # 0.0.4
        with:
          release-tag: ${{ github.event.release.tag_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          configure-flags: ${{ env.CONFIGURE_FLAGS }}
