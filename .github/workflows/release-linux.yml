name: Release Linux & macOS binaries

# Triggered when a GitHub Release is published. Builds .so binaries for
# Linux glibc (x86_64 + arm64) and macOS (arm64) at the PHP versions in
# the matrix (NTS only; ZTS lives in the Windows lane), gates each one, then
# uploads all of them as release assets using PIE's pre-packaged-binary
# naming convention (php_phpser-<tag>_php<x.y>-<arch>-<os>-<libc>.zip).
#
# Each binary compiles against a pinned NEWEST patch release of its PHP
# minor (8.4.27, 8.5.12), so it carries the memory_limit stop behind
# ZEND_HAS_OOM. Those headers make the module import symbols that earlier
# patches do not export, so the binaries require 8.4.27+ / 8.5.12+. On an
# older patch the extension refuses to start with a warning (MINIT compares
# php_version_id() against the build's PHP_VERSION_ID) instead of dying
# with "undefined symbol" on first use. Linux builds inside the
# digest-pinned official bookworm image; macOS builds PHP from the
# checksum-pinned php.net release tarball, so a later patch release cannot
# raise the floor without a repo diff.
#
# Before anything uploads, every binary must load and round-trip a payload
# large enough to grow the encoder's smart_str on the build patch, every
# symbol a Linux .so imports must be exported by that patch's php binary or
# a library loaded with it, and a Linux .so must refuse to start, not crash,
# on the oldest patch of its minor (PHP 8.4.0 was never released, so 8.4.1
# is the oldest 8.4 patch). The upload job runs only after every build
# passes, so a failed gate attaches no Linux or macOS asset.
#
# macOS Intel (macos-13) is absent: GitHub's Intel runner pool queues 30+
# min on busy days, and macOS 26 drops Intel. Linux musl (Alpine) is absent
# because setup-php in Alpine containers needs more setup. Both source-build
# via PIE's composer-default fallback.
#
# composer.json declares:
#   "download-url-method": ["pre-packaged-binary", "composer-default"]
# so PIE prefers the prebuilt asset and falls back to source-build when
# no asset matches.
#
# workflow_dispatch runs the same builds and gates on a candidate commit
# before the tag exists, and uploads nothing.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

env:
  # Shared by every build, so the Linux and macOS binaries cannot drift into
  # configuring the extension differently.
  CONFIGURE_FLAGS: '--enable-phpser'
  # 4096 distinct strings encode to well over 64 KiB, growing the encoder's
  # smart_str through repeated reallocations.
  SMOKE_PHP: |
    if (!extension_loaded('phpser')) { fwrite(STDERR, "phpser did not load\n"); exit(1); }
    $v = [];
    for ($i = 0; $i < 4096; $i++) { $v["k$i"] = "value-$i-" . str_repeat(chr(65 + $i % 26), 24); }
    $s = phpser_serialize($v);
    if (strlen($s) < 65536) { fwrite(STDERR, 'payload too small: ' . strlen($s) . "\n"); exit(1); }
    if (phpser_unserialize($s) !== $v) { fwrite(STDERR, "round trip mismatch\n"); exit(1); }
    echo 'PHP ', PHP_VERSION, ' phpser ', phpversion('phpser'), ': ', strlen($s), "-byte round trip ok\n";

concurrency:
  # tag_name is empty on a dispatch run; fall back to the ref so two
  # dispatches on different branches do not serialize behind each other.
  group: release-linux-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: ${{ matrix.os }} php ${{ matrix.php }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # Checks out the source; uploads go through the upload job.
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 (x86_64), ubuntu-24.04-arm (arm64). The build runs in
        # the pinned bookworm image, so the binary's glibc baseline is
        # bookworm's 2.36, not the runner's.
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
        php: ['8.4', '8.5']
        include:
          # Official Docker images, digest-pinned. The newest-patch image
          # produces the shipped binary and sets its PHP floor; bumping it
          # raises that floor. The oldest-patch image is the gate that the
          # binary refuses to start below the floor.
          - php: '8.4'
            oldest-image: php:8.4.1-cli-bookworm@sha256:246d2ca7e9cf21c4e7c354ce87e87bf1ad6d41b2061c77668845e04a8f8889d4
            newest-image: php:8.4.27-cli-bookworm@sha256:54b467ede1db96c66675e7b78457dd43729d0e7be31978d4a1e5c069ceabcf76
          - php: '8.5'
            oldest-image: php:8.5.0-cli-bookworm@sha256:4ff93cd1b053c4d5ff468ced40962092a350a8c86798fee96e807bc9b383ec75
            newest-image: php:8.5.12-cli-bookworm@sha256:104890ada56869090c9cd0ec709fe205834d3e383b46d9995dc16cd6388a9302
    env:
      OLDEST: ${{ matrix.oldest-image }}
      NEWEST: ${{ matrix.newest-image }}
      MATRIX_PHP: ${{ matrix.php }}
      RELEASE_TAG: ${{ github.event.release.tag_name || 'dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Anonymous pulls from shared runner IPs hit both Docker Hub's and ECR
      # Public's per-IP limits. ghcr.io/iliaal/php and ECR Public mirror the
      # official images under the same digests, so any source yields the
      # pinned build image. A reference without a digest is rejected.
      - name: Pull the oldest and newest patch images
        run: |
          set -euo pipefail
          pull() {
            local delay reg
            local -a regs=(ghcr.io/iliaal docker.io/library public.ecr.aws/docker/library)
            if [[ "$2" != php:*@sha256:* ]]; then
              echo "::error::$1 is not digest-pinned: $2"
              return 1
            fi
            for delay in 10 30 60 0; do
              for reg in "${regs[@]}"; do
                if docker pull -q "$reg/$2" > /dev/null; then
                  echo "$1=$reg/$2" >> "$GITHUB_ENV"
                  docker image inspect --format "$1: {{index .RepoDigests 0}}" "$reg/$2"
                  return 0
                fi
              done
              [ "$delay" -gt 0 ] || return 1
              sleep "$delay"
            done
          }
          pull OLDEST_IMAGE "$OLDEST"
          pull NEWEST_IMAGE "$NEWEST"

      - name: Build against the newest patch and check its imports
        run: |
          set -euo pipefail
          docker run --pull never --rm -i -e CONFIGURE_FLAGS -e HOST_OWNER="$(id -u):$(id -g)" \
            -v "$PWD:/src" -w /src "$NEWEST_IMAGE" bash -euo pipefail -s <<'EOF'
          export LC_ALL=C
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends $PHPIZE_DEPS > /dev/null
          phpize
          ./configure $CONFIGURE_FLAGS
          make -j"$(nproc)"
          chown -R "$HOST_OWNER" /src

          php_bin=$(command -v php)
          so=modules/phpser.so
          { ldd "$php_bin"; ldd "$so"; } \
            | awk '$2 == "=>" && $3 ~ /^\// { print $3 } $1 ~ /^\// { print $1 }' \
            | sort -u > /tmp/libs
          { nm -D --defined-only "$php_bin"; xargs -r nm -D --defined-only < /tmp/libs; } \
            | awk 'NF >= 3 { sub(/@@/, "@", $3); print $3 }' | sort -u > /tmp/provided
          nm -D --undefined-only "$so" | awk '$1 == "U" { print $2 }' | sort -u > /tmp/imports
          comm -23 /tmp/imports /tmp/provided > /tmp/missing
          version=$(php -n -r 'echo PHP_VERSION;')
          if [ -s /tmp/missing ]; then
            echo "::error::$so imports symbols that PHP $version does not export:"
            cat /tmp/missing
            exit 1
          fi
          echo "$(wc -l < /tmp/imports) imports, all exported by PHP $version or its libraries"
          EOF

      - name: Load on the newest patch, refuse the oldest
        run: |
          set -euo pipefail
          run() {
            rc=0
            out=$(docker run --pull never --rm -v "$PWD/modules/phpser.so:/ext.so:ro" "$1" \
              php -n -d extension=/ext.so -r "$SMOKE_PHP" 2>&1) || rc=$?
            printf '%s\n' "$out"
          }
          status=0
          echo "::group::$NEWEST_IMAGE"
          run "$NEWEST_IMAGE"
          echo "::endgroup::"
          if [ "$rc" -ne 0 ] || printf '%s\n' "$out" | grep -qi 'undefined symbol'; then
            echo "::error::phpser.so failed on $NEWEST_IMAGE (exit $rc)"
            status=1
          fi
          echo "::group::$OLDEST_IMAGE"
          run "$OLDEST_IMAGE"
          echo "::endgroup::"
          if [ "$rc" -eq 0 ] || printf '%s\n' "$out" | grep -qi 'undefined symbol' \
              || ! printf '%s\n' "$out" | grep -q 'phpser was built for PHP .* and cannot run on PHP' \
              || ! printf '%s\n' "$out" | grep -q 'Unable to start phpser module'; then
            echo "::error::phpser.so did not refuse to start on $OLDEST_IMAGE (exit $rc)"
            status=1
          fi
          exit "$status"

      - name: Package
        id: package
        run: |
          set -euo pipefail
          suffix=$(docker run --rm --pull never "$NEWEST_IMAGE" php -n -r \
            'echo PHP_MAJOR_VERSION, ".", PHP_MINOR_VERSION, PHP_DEBUG ? "-debug" : "", ZEND_THREAD_SAFE ? "-zts" : "";')
          case "$suffix" in
            "$MATRIX_PHP"*) ;;
            *) echo "::error::build PHP $suffix does not match matrix PHP $MATRIX_PHP"; exit 1 ;;
          esac
          case "$(uname -m)" in
            x86_64) arch=x86_64 ;;
            aarch64) arch=arm64 ;;
            *) echo "::error::unsupported architecture $(uname -m)"; exit 1 ;;
          esac
          php_mm=${suffix%%-*}
          rest=${suffix#"$php_mm"}
          pkg="php_phpser-${RELEASE_TAG}_php${php_mm}-${arch}-linux-glibc${rest}.zip"
          zip -j "$pkg" modules/phpser.so
          echo "pkg=$pkg" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.pkg }}
          path: ${{ steps.package.outputs.pkg }}
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macos-15 php ${{ matrix.php }}
    # Builds on macos-15 because setup-php's Homebrew install fails on
    # macos-14 runners; the asset still targets macOS 14 as its minimum.
    runs-on: macos-15
    permissions:
      contents: read # Checks out the source; uploads go through the upload job.
    strategy:
      fail-fast: false
      matrix:
        include:
          # php.net release tarballs and their published SHA-256 sums. Keep
          # these patches equal to the Linux newest-image patches.
          - php: '8.4'
            newest: '8.4.27'
            newest-sha256: dcf93923b0e38e0d5252b25b796520b5a47761a08b3488b6d0b5d1115764d3f0
          - php: '8.5'
            newest: '8.5.12'
            newest-sha256: 08bc2eba2a588654ade1357174aa646b761556c862dda0678345ee29ed481209
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      NEWEST: ${{ matrix.newest }}
      NEWEST_SHA256: ${{ matrix.newest-sha256 }}
      MATRIX_PHP: ${{ matrix.php }}
      RELEASE_TAG: ${{ github.event.release.tag_name || 'dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build PHP ${{ matrix.newest }} from the release tarball
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o php-src.tar.xz "https://www.php.net/distributions/php-${NEWEST}.tar.xz"
          echo "${NEWEST_SHA256}  php-src.tar.xz" | shasum -a 256 -c -
          tar -xJf php-src.tar.xz
          cd "php-${NEWEST}"
          # session supplies HAVE_PHP_SESSION, which the extension's session
          # serializer compiles against; everything else is irrelevant here.
          ./configure --prefix="$RUNNER_TEMP/php-newest" --disable-all --enable-session \
            --disable-cgi --disable-phpdbg > /dev/null
          make -j"$(sysctl -n hw.ncpu)" > /dev/null
          make install > /dev/null
          "$RUNNER_TEMP/php-newest/bin/php" -n -v

      - name: Build against the newest patch
        run: |
          set -euo pipefail
          # phpize needs autoconf, which the runner image does not ship.
          brew install autoconf
          bin="$RUNNER_TEMP/php-newest/bin"
          read -ra flags <<< "$CONFIGURE_FLAGS"
          "$bin/phpize"
          ./configure --with-php-config="$bin/php-config" "${flags[@]}"
          make -j"$(sysctl -n hw.ncpu)"

      - name: Load on the newest patch
        run: |
          set -euo pipefail
          rc=0
          out=$("$RUNNER_TEMP/php-newest/bin/php" -n -d extension="$PWD/modules/phpser.so" -r "$SMOKE_PHP" 2>&1) || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ] || printf '%s\n' "$out" | grep -Eqi 'undefined symbol|symbol not found'; then
            echo "::error::phpser.so failed on PHP $NEWEST (exit $rc)"
            exit 1
          fi

      - name: Package
        id: package
        run: |
          set -euo pipefail
          suffix=$("$RUNNER_TEMP/php-newest/bin/php" -n -r \
            'echo PHP_MAJOR_VERSION, ".", PHP_MINOR_VERSION, PHP_DEBUG ? "-debug" : "", ZEND_THREAD_SAFE ? "-zts" : "";')
          case "$suffix" in
            "$MATRIX_PHP"*) ;;
            *) echo "::error::build PHP $suffix does not match matrix PHP $MATRIX_PHP"; exit 1 ;;
          esac
          test "$(uname -m)" = arm64
          php_mm=${suffix%%-*}
          rest=${suffix#"$php_mm"}
          pkg="php_phpser-${RELEASE_TAG}_php${php_mm}-arm64-darwin-bsdlibc${rest}.zip"
          zip -j "$pkg" modules/phpser.so
          echo "pkg=$pkg" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.pkg }}
          path: ${{ steps.package.outputs.pkg }}
          if-no-files-found: error
          retention-days: 7

  upload:
    name: Upload binaries to the release
    needs: [linux, macos]
    # Only the release event has a tag to upload into.
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Uploads binary assets to the published release.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: php_phpser-*
          path: dist
          merge-multiple: true

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          ls -l dist
          gh release upload "$RELEASE_TAG" dist/*.zip --repo "$GITHUB_REPOSITORY"
