name: PHP master (advisory)

# Builds against php-src master through setup-php's nightly build. The job is
# continue-on-error, so an upstream break shows up here without blocking merges.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  group: php-master-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  php-master:
    name: PHP 8.7 (master, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@3c21e10268bafaf84c59e8f4e65b39acacb62ca4 # main # zizmor: ignore[stale-action-refs,ref-version-mismatch]
        with:
          php-version: '8.7'
          tools: phpize, php-config

      - name: Show PHP build
        run: php -v

      - name: Build extension
        run: |
          phpize
          ./configure --enable-phpser
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee build.log
          WARNINGS=$(grep -c 'warning:' build.log || true)
          if [ "$WARNINGS" -gt 0 ]; then
            echo "::error::Build produced $WARNINGS warning(s)"
            exit 1
          fi

      - name: Run tests
        env:
          NO_INTERACTION: 1
        run: |
          TEST_PHP_EXECUTABLE=$(which php)
          TEST_PHP_ARGS="-d extension=$(pwd)/modules/phpser.so"
          export TEST_PHP_EXECUTABLE TEST_PHP_ARGS
          php run-tests.php --show-diff -g FAIL,BORK,LEAK,XLEAK tests/
