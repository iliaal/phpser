name: Release Windows binaries

# Triggered when a GitHub Release is published (manual or from a tag push
# via /release-ext). Builds the extension on every supported PHP version
# x architecture x thread-safety variant on Windows runners, then
# uploads each .dll as a release asset following the PIE-compatible
# naming convention (php_phpser-<version>-<php_x.y>-<ts|nts>-vs17-<arch>.zip).
#
# Tests are off in this lane -- the test workflow already validated the
# same arch/ts/php combinations on master.
#
# workflow_dispatch runs the build matrix without the upload job, so the
# release toolsets can be exercised on a candidate commit BEFORE the tag
# exists. A break that only shows up on the release runners (an MSVC
# toolset the push-CI matrix does not cover, say) then fails here instead
# of after the tag is live, where the all-or-nothing upload job would ship
# the release with zero Windows assets.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  # tag_name is empty on a dispatch run; fall back to the ref so two
  # dispatches on different branches do not serialize behind each other.
  group: release-windows-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  matrix:
    name: Resolve Windows release matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: matrix
        uses: php/php-windows-builder/extension-matrix@29352c0ef9e8ce65264ea9e287881a6f7758a953 # 1.9.0
        with:
          php-version-list: '8.2, 8.3, 8.4, 8.5'

  build:
    name: Build ${{ matrix.php-version }} ${{ matrix.ts }} ${{ matrix.arch }}
    needs: matrix
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: php/php-windows-builder/extension@29352c0ef9e8ce65264ea9e287881a6f7758a953 # 1.9.0
        with:
          php-version: ${{ matrix.php-version }}
          arch: ${{ matrix.arch }}
          ts: ${{ matrix.ts }}
          run-tests: 'false'

  release:
    name: Upload binaries to the release
    runs-on: ubuntu-latest
    needs: build
    # Only the real release event has a tag to upload into. A dispatch run
    # stops after `build`, which is the point: it validates the toolsets
    # and publishes nothing.
    if: github.event_name == 'release'
    # GITHUB_TOKEN defaults to read-only for `contents:` on newer repos.
    # The release/asset-upload API needs write access; without this block
    # `gh release upload` returns HTTP 403 "Resource not accessible by
    # integration". See ~/ai/wiki/architecture/php-extensions.md, the
    # "Windows binary releases" section, for the full backstory.
    permissions:
      contents: write # Uploads Windows binaries to the published release.
    steps:
      - uses: php/php-windows-builder/release@29352c0ef9e8ce65264ea9e287881a6f7758a953 # 1.9.0
        with:
          release: ${{ github.event.release.tag_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
